<style id="draft1-block1">
    /* ── NEW HERO — SECTOR SHOWCASE ─────────────── */
    #hero-new {
      position: relative;
      height: 108vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;

    /* Stacked slide layers — pure opacity crossfade, no scaling */

      position: absolute; inset: 0;

      transition: opacity 1.6s cubic-bezier(0.32, 0.72, 0, 1);

      transition: opacity 1.5s cubic-bezier(0.32, 0.72, 0, 1);

    .hn-overlay {
      position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(to right,
          rgba(0,0,0,0.78) 0%,

      border: 1px solid rgba(255,255,255,0.50);

    }
    .hn-btn::before {
      content: '';
      position: absolute; inset: 0;

    .hn-btn:hover .hn-btn-icon { transform: translateX(3px); background: transparent; }
    .hn-btn:active { transform: scale(0.975); transition: transform 0.08s ease; }

    .hn-scroll-btn {
      position: absolute; z-index: 5;
      right: calc(10% + 6.667% - 46px); top: calc(100vh - 168px); transform: translateY(-50%);
      cursor: pointer; text-decoration: none;
      opacity: 1; transition: opacity 0.5s ease;
    }
    .hn-scroll-btn:hover { opacity: 1; }
    .hn-scroll-btn.hn-scrolled-away { opacity: 0; pointer-events: none; }
    .hn-scroll-wrap { position: relative; width: 92px; height: 92px; }
    .hn-scroll-disk {
      position: absolute; inset: 0; border-radius: 50%;

      70%  { transform: translateX(-50%) translateY(-4px); }
      100% { transform: translateX(-50%) translateY(0); }
    }

    .hn-tabs {
      position: absolute; z-index: 3;
      left: 50%; transform: translateX(-50%);
      width: 80%;
      top: calc(100vh - 96px);
      padding: 20px 0 28px;

    }
    .hn-timeline {
      display: flex; align-items: flex-start; gap: 0;

    .hn-tab-num { display: none; }
    .hn-tab-name {

      font-size: 12px; font-weight: 500;

    .hn-tab.hn-active .hn-tab-name { color: rgba(255,255,255,0.95); font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,0.45), 0 0 20px rgba(0,0,0,0.20); }
    .hn-tab.hn-played .hn-tab-name { color: rgba(255,255,255,0.58); }
    .hn-tab:hover .hn-tab-name { color: rgba(255,255,255,0.82); }

    /* ── THUMBNAIL NAVIGATOR ── */
    .hn-thumbs {
      position: absolute; z-index: 5;
      right: calc(10% + 8px); top: calc(100vh - 179px);
      display: flex; flex-direction: column; align-items: flex-end; gap: 13px;
    }
    .hn-thumb-arrow {
      align-self: flex-end; width: 36px; height: 36px; border-radius: 50%;
      background: #ffffff;

    }

    .hn-thumb-arrow svg { width: 14px; height: 14px; fill: rgba(0,0,0,0.82); stroke: none; margin-left: 2px; }

      opacity: 0.52; flex-shrink: 0;

    .hn-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .hn-thumb:hover { opacity: 0.78; transform: translateY(-3px) scale(1.05); border-color: rgba(255,255,255,0.38); }
    .hn-thumb.hn-thumb-active {
      opacity: 1; border: 1px solid rgba(255,255,255,0.82);

      .hn-thumbs { right: 20px; }
      .hn-thumb { width: 48px; height: 32px; border-radius: 4px; }
    }

    .hn-top-blur {
      position: absolute; top: 0; left: 0; right: 0;
      height: 110px; z-index: 4; pointer-events: none;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
    }
    .hn-cursor {
      position: fixed; z-index: 9999; pointer-events: none;
      width: 76px; height: 76px; border-radius: 50%;

    .hn-cursor.hn-cursor-visible { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    .hn-cursor.hn-cursor-hidden { opacity: 0; transform: translate(-50%,-50%) scale(0.75); }
    .hn-cursor-label { font-family: var(--font-body); font-size: 13px; letter-spacing: 0.04em; color: rgba(255,255,255,0.92); font-weight: 500; }

<style id="draft1-block2">
